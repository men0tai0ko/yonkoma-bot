name: Daily Comic

on:
  schedule:
    - cron: "0 0 * * *" # JST 09:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-comic
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate script
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate_script.mjs

      - name: Render comic
        id: render
        run: node scripts/render_comic.mjs

      - name: Mark failure status (script generation stage)
        if: failure() && steps.generate.outcome == 'failure'
        run: node scripts/mark_failed.mjs "台本生成ステップが失敗しました (Run #${{ github.run_id }})"

      - name: Commit and push
        if: always()
        run: |
          git config user.name "yonkoma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/comics
          if git diff --cached --quiet; then
            echo "変更なし、コミットをスキップします"
          else
            git commit -m "四コマを自動更新 ($(date -u +'%Y-%m-%d'))"
            git push
          fi
