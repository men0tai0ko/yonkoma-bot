<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yonkoma-bot | 毎朝AIが4コマ漫画を自動生成</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>🤖🐱 yonkoma-bot</h1>
    <p class="tagline">毎朝、AIがロボ子とにゃん太の4コマ漫画をひとつ描いてます。</p>
    <div id="status-badge" class="status-badge status-loading">実行状況を確認中…</div>
    <div id="workflow-badge-wrap"></div>
  </header>

  <main>
    <section class="latest" id="latest-section">
      <h2>最新の1本</h2>
      <div id="latest-comic" class="latest-comic">読み込み中…</div>
    </section>

    <section class="gallery">
      <h2>これまでの4コマ</h2>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button id="lightbox-close" class="lightbox-close" aria-label="閉じる">×</button>
      <img id="lightbox-img" src="" alt="" />
      <p id="lightbox-caption"></p>
    </div>
  </div>

  <footer>
    <p>Generated automatically by GitHub Actions · <a href="https://github.com/" id="repo-link" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
